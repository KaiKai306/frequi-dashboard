services:
  trellis-preview:
    image: caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    container_name: binance-quant-trellis-preview
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    mem_limit: 128m
    cpus: 0.4
    pids_limit: 96
    cap_drop: [ALL]
    # The pinned upstream Caddy binary carries this file capability.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./trellis/public:/srv/trellis:ro
      - ./trellis/Preview.Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:rw,noexec,nosuid,size=8m,uid=1000,gid=1000,mode=0700
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
